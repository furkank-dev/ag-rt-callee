name: reusable
on:
  workflow_call:
    secrets:
      DUMMY_MARKER:
        required: false
permissions:
  contents: read
jobs:
  inner:
    runs-on: ubuntu-latest
    steps:
      # BILEREK hareketli ref: caller callee'yi SHA ile pinlese de bu satir kayar mi?
      - uses: furkank-dev/ag-rt-inner@main
        env:
          SECRET: ${{ secrets.DUMMY_MARKER }}
      # Deger ASLA yazdirilmaz, sadece varlik kontrolu
      - run: echo "SECRET ERISIMI (callee): ${SECRET:+VAR}"
        env:
          SECRET: ${{ secrets.DUMMY_MARKER }}
